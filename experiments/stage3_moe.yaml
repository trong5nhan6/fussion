# Stage 3 — Multimodal MoE (ảnh + metadata): backbone x hướng x loss x nhánh ảnh, fold 0.
# Chọn tổ hợp khi chạy: --backbones vit_base --archs A,B,C,D,E --overlays ce_sqrt_inv,sampler_q05 --views clin,derm,clin+derm
# Hướng C, D, E (3 head long-tail) tự có loss riêng: chỉ giữ overlay sampler + 1 run không overlay (tag "lt").
# Tên run: <backbone>__<hướng>__<tag>__<nhánh ảnh>
name: stage3_moe
backbones:
  vit_base: configs/baselines/vit_base.yaml
  swin_base: configs/baselines/swin_base.yaml
  dinov2_base: configs/baselines/dinov2_base.yaml   # concat CLS + MLP 2 lớp (với MoE: dùng làm backbone)
  convnext_base: configs/baselines/cnn_convnext_base.yaml
  resnet152:
    config: configs/baselines/cnn_resnet152.yaml
    set: [train.batch_size=8, train.accum_steps=4]
archs:
  A: configs/moe/A.yaml
  B: configs/moe/B.yaml
  C: configs/moe/C.yaml
  D: configs/moe/D.yaml
  E: configs/moe/E.yaml
overlays:
  - configs/imbalance/ce_plain.yaml
  - configs/imbalance/ce_sqrt_inv.yaml
  - configs/imbalance/ce_inv.yaml
  - configs/imbalance/cb_effective_num.yaml
  - configs/imbalance/cb_focal.yaml
  - configs/imbalance/logit_adjusted.yaml
  - configs/imbalance/sampler_q05.yaml
  - configs/imbalance/sampler_q1.yaml
  - configs/imbalance/crt.yaml
  - configs/imbalance/bce.yaml
  - configs/ablation/r5_all.yaml     # BCE + squash + aug mạnh + lr + drop path (A, B)
  - configs/ablation/r5_nobce.yaml   # như trên nhưng giữ sampler, không BCE (C, D, E)
views:
  - [clin]
  - [derm]
  - [clin, derm]
set: []
