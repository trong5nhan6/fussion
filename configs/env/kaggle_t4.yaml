# Profile cho Kaggle GPU T4 x2 (16GB VRAM mỗi GPU, 4 vCPU, output tối đa 20GB).
# Truyền SAU baseline và overlay, ghi đè cấu hình dành cho GPU 4GB trong configs/baselines/.
# run_grid.py chạy 2 run song song, mỗi run 1 GPU.
data:
  num_workers: 2            # 4 vCPU chia cho 2 job song song
model:
  grad_checkpointing: false # đủ VRAM -> tắt để train nhanh hơn
train:
  batch_size: 16            # batch hiệu dụng giữ 32 như mọi cấu hình khác
  accum_steps: 2
  amp: true
keep_checkpoints: false     # mỗi checkpoint base ~350MB -> xoá sau khi sinh file nộp
