# Cấu hình gốc. Các file khác kế thừa bằng `base: ...` và chỉ ghi phần khác biệt.
# Ghi đè từ CLI: --set train.epochs=5 model.backbone=resnet18
seed: 42
debug: false             # true -> mỗi epoch chỉ chạy vài batch để kiểm tra pipeline
output_dir: outputs
keep_checkpoints: true   # false: xoá fold*/best*.pt sau khi đã sinh file nộp (tiết kiệm dung lượng)

data:
  root: datasets/MILK10k
  train_csv: train/train_combined.csv
  test_csv: test/test_combined.csv
  train_img_dir: train/MILK10k_Training_Input
  test_img_dir: test/MILK10k_Test_Input
  folds_csv: splits/folds_5.csv   # nằm trong repo (scripts/make_folds.py), để mọi máy dùng cùng cách chia
  img_size: 320          # kích thước ảnh vuông đưa vào mô hình
  resize: squash         # squash: resize thẳng về vuông (dùng 100% điểm ảnh) | pad: giữ tỉ lệ 4:3 + pad viền đen
  aug: strong            # strong: RandomResizedCrop, xoay, màu, blur/nhiễu, xoá vùng | basic: lật, affine, màu nhẹ
  num_workers: 4

model:
  name: image            # xem src/milk10k/models/__init__.py
  backbone: efficientnet_b0
  pretrained: true
  # Nhánh ảnh dùng để train (ablation): [clin] | [derm] | [clin, derm]
  # Đổi nhanh từ CLI: --set model.views=[derm]
  views: [clin, derm]
  dropout: 0.3
  mlp_hidden: 512        # model image / concat_mlp: lớp ẩn của MLP 2 lớp sau khi nối đặc trưng các ảnh
  drop_path_rate: 0.0    # stochastic depth của backbone (0.1–0.2 giúp giảm overfit)
  grad_checkpointing: false  # true: giảm VRAM (~40-60%), train chậm hơn ~20-30%

# Multimodal MoE (model.name: moe, chọn hướng bằng configs/moe/{A,B,C,D}.yaml)
moe:
  d_model: null          # null: token ảnh = CLS của backbone, không chiếu (d = 768 ViT/DINOv2, 1024 Swin/ConvNeXt)
                         # số nguyên (vd 256): chiếu đặc trưng ảnh về d chiều như phiên bản cũ
  n_experts: 4           # B/C: số expert trong MoE-FFN
  top_k: 2               # B/C: mỗi token qua top-k expert
  n_blocks: 2            # B/C: số khối transformer
  n_heads: 4             # B/C: số head attention
  balance_alpha: 0.01    # B/C: trọng số load-balancing loss
  aux_weight: 0.25       # trọng số loss phụ của head từng nguồn
  modality_dropout: 0.15 # xác suất che mỗi nguồn khi train
  lt_taus: [0.0, 0.5, 1.0]  # C/D: τ của 3 head long-tail
  dropout: 0.1
  fusion_lr_mult: 1.0    # lr của phần MoE mới khởi tạo = train.lr * hệ số này

# Xử lý mất cân bằng — xem src/milk10k/losses.py và configs/imbalance/
loss:
  name: ce               # ce | focal | logit_adjusted | bce (sigmoid độc lập từng lớp)
  class_weight: sqrt_inv # none | inv | sqrt_inv | effective_num
  cb_beta: 0.999         # cho effective_num; tiến về 1 thì gần với inv
  la_tau: 1.0            # cho logit_adjusted
  pos_weight_clip: 10.0  # cho bce: pos_weight = n_âm/n_dương, chặn tối đa (0 = không dùng pos_weight)
  focal_gamma: 2.0
  label_smoothing: 0.0

train:
  epochs: 20
  batch_size: 16
  accum_steps: 2         # batch hiệu dụng = batch_size * accum_steps
  lr: 3.0e-4             # lr của head
  backbone_lr_mult: 0.1  # lr backbone = lr * mult
  weight_decay: 1.0e-2
  warmup_epochs: 1
  amp: true              # chỉ có tác dụng khi có CUDA
  sampler_q: null        # null: shuffle thường | q in [0,1]: P(lớp c) ~ n_c^(1-q); 1 = cân bằng hoàn toàn
  monitor: dice          # metric chọn checkpoint: dice (xếp hạng leaderboard) | auc | ap | balanced_acc
  patience: 5
  # Giai đoạn thử nghiệm: chỉ fold 0 (val = 1.048 lesion). Khi đã chọn được method,
  # chạy đủ 5 fold: --set train.folds=[0,1,2,3,4]
  folds: [0]
  # true: train trên TOÀN BỘ dữ liệu (không chia val) để nộp bài. Không có metric val, không early stop,
  # dùng checkpoint ở epoch cuối -> đặt train.epochs bằng số epoch tốt nhất đã thấy khi chạy có val.
  full_data: false

crt:                     # Classifier re-training sau giai đoạn 1 (Kang et al., 2020)
  enabled: false
  epochs: 10
  lr: 1.0e-3
  sampler_q: 1.0         # lấy mẫu cân bằng cho head
  reinit_head: true
  patience: 10

predict:
  tta: true              # trung bình thêm ảnh lật ngang + lật dọc
  # Cuộc thi nhị phân hoá MỖI lớp theo ngưỡng > 0.5 (không lấy argmax):
  #   top1    : lớp argmax -> 0.5+0.5p, lớp khác -> 0.5p  => mỗi lesion đúng 1 lớp dương
  #   softmax : giữ xác suất thô (lesion có max < 0.5 sẽ không có lớp dương nào)
  #   sigmoid : (loss bce) xác suất sigmoid độc lập, mỗi lớp tự so 0.5 -> 0, 1 hoặc nhiều lớp dương
  # Metric val được tính trên điểm SAU hậu xử lý -> khớp cách chấm leaderboard.
  postprocess: auto      # auto: sigmoid nếu loss=bce, ngược lại top1 | top1 | softmax | sigmoid
  after_train: true      # train xong tự sinh submission.csv cho tập test
